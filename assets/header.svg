<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Background Decorative Grid -->
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#grid)"/>

  <!-- Decorative Top Right Glow Blob -->
  <circle cx="760" cy="50" r="120" fill="#818cf8" fill-opacity="0.08" filter="blur(40px)"/>
  <circle cx="100" cy="180" r="100" fill="#38bdf8" fill-opacity="0.06" filter="blur(30px)"/>

  <!-- Status Badge (Top Left) -->
  <g transform="translate(45, 32)">
    <rect width="240" height="26" rx="13" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="26" y="17" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">FULL-STACK &amp; CLOUD SYSTEMS</text>
  </g>

  <!-- Main Name Header -->
  <text x="45" y="100" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Amr Emirate Abdurahman
  </text>

  <!-- Animated-like Gradient Line Under Name -->
  <rect x="45" y="112" width="460" height="3" rx="1.5" fill="url(#accent-grad)"/>

  <!-- Role Subtitle -->
  <text x="45" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    Full-Stack Software Engineer &amp; DevOps Practitioner
  </text>

  <!-- Tagline / Focus Areas -->
  <g transform="translate(45, 172)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">⚡ TypeScript 5</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="135" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="152" y="16" fill="#818cf8" font-family="monospace" font-size="11" font-weight="600">🚀 Node &amp; Express</text>

    <!-- Pill 3 -->
    <rect x="285" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="297" y="16" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600">🐘 PostgreSQL 18</text>

    <!-- Pill 4 -->
    <rect x="425" y="0" width="150" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="437" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">🐳 Docker &amp; CI/CD</text>

    <!-- Pill 5 -->
    <rect x="585" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="597" y="16" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">☁️ Cloud Systems</text>
  </g>
</svg>